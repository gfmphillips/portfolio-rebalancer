allocation:
  us_equity: 48
  intl_equity: 32
  bonds: 20

rebalance:
  threshold_pct: 5.0
  threshold_relative_pct: 20.0
  min_trade_value: 500

cash:
  eurusd_fx: 1.10
  investable:
    eur: 0
    usd: 0
  emergency:
    eur: 0
    usd: 0

tax:
  enabled: false            # sets both tlh_enabled and avoid_gains_in_taxable if they are not specified
  # tlh_enabled: true       # optional override: enable tax-loss harvesting independently
  # avoid_gains_in_taxable: false  # optional override: allow selling at a gain in taxable accounts

accounts:
  "Individual": taxable
  "Taxable": taxable
  "Brokerage": taxable
  "ROTH": roth_ira
  "Rollover": traditional_ira
  "Traditional": traditional_ira
  "401(K)": 401k

output:
  show_only_actionable_trades: true
  sort_order: [sells_first, largest_trade_first]
  precision:
    currency: 0
    pct: 2

# constraints:
#   min_taxable_bonds_usd: 10000  # warn if post-trade taxable bonds fall below this

german_tax:
  enabled: true
  filing_status: married
  kirchensteuer: false
